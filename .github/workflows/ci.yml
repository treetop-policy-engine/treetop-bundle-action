name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit:
    name: Unit and metadata tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Lint workflows and action metadata
        run: |
          actionlint_bin="$(go env GOPATH)/bin/actionlint"
          "$actionlint_bin"

  native-scenarios:
    name: ${{ matrix.name }} scenarios
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            binary: treetop-bundle/target/release/treetop-bundle
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            binary: treetop-bundle/target/release/treetop-bundle
          - name: macOS ARM64
            runner: macos-15
            binary: treetop-bundle/target/release/treetop-bundle
          - name: Windows x86-64
            runner: windows-2025
            binary: treetop-bundle/target/release/treetop-bundle.exe
    steps:
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout pinned treetop-bundle source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: treetop-policy-engine/treetop-bundle
          ref: 9a0463383c4837d2076f2d63862abae0832083fd # 0.1.0 candidate
          path: treetop-bundle
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: treetop-bundle -> target
      - name: Build native CLI
        working-directory: treetop-bundle
        run: cargo build --locked --release -p treetop-bundle-cli

      - name: Check a complete bundle
        id: valid
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/valid
          deny-warnings: true
      - name: Check one module
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/valid
          manifest: treetop-module.toml
      - name: Check a standalone policy with schema and labels
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/valid
          target: policy
          manifest: policy.cedar
          schema: schema.cedarschema
          labels: labels.json
      - name: Check a multi-module bundle with an import
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/multi-module
      - name: Check paths containing spaces
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/path with spaces

      - name: Allow a warning by default
        id: warning-allowed
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/warning
          target: policy
          manifest: policy.cedar
          labels: labels.json
      - name: Deny the same warning
        id: warning-denied
        continue-on-error: true
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/warning
          target: policy
          manifest: policy.cedar
          labels: labels.json
          deny-warnings: true
      - name: Reject invalid policy content
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/invalid

      - name: Reject legacy format 1
        id: legacy
        continue-on-error: true
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/legacy
      - name: Reject duplicate declared targets
        id: duplicate
        continue-on-error: true
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/duplicate-target

      - name: Build a deterministic unsigned bundle
        id: build
        uses: ./
        with:
          binary-path: ${{ matrix.binary }}
          working-directory: test/fixtures/valid
          build-output: ${{ runner.temp }}/treetop-bundle.tar.gz
          deny-warnings: true
      - name: Verify scenario outcomes and archive hash
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.build.outputs.archive-path }}
          ARCHIVE_SHA256: ${{ steps.build.outputs.archive-sha256 }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
          DUPLICATE_OUTCOME: ${{ steps.duplicate.outcome }}
          VALID_RESULT: ${{ steps.valid.outputs.valid }}
          WARNING_ALLOWED_RESULT: ${{ steps.warning-allowed.outputs.valid }}
          WARNING_DENIED_OUTCOME: ${{ steps.warning-denied.outcome }}
        run: |
          [[ "$VALID_RESULT" == "true" ]]
          [[ "$WARNING_ALLOWED_RESULT" == "true" ]]
          [[ "$WARNING_DENIED_OUTCOME" == "failure" ]]
          [[ "$INVALID_OUTCOME" == "failure" ]]
          [[ "$LEGACY_OUTCOME" == "failure" ]]
          [[ "$DUPLICATE_OUTCOME" == "failure" ]]
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const actual = crypto.createHash("sha256")
              .update(fs.readFileSync(process.env.ARCHIVE_PATH)).digest("hex");
            if (actual !== process.env.ARCHIVE_SHA256) process.exit(1);
          '

  candidate-download:
    name: Package, download, and verify candidate CLI on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            extension: ""
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            extension: ""
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            extension: ""
          - name: Windows x86-64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: ".exe"
    steps:
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: treetop-policy-engine/treetop-bundle
          ref: 9a0463383c4837d2076f2d63862abae0832083fd
          path: treetop-bundle
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: treetop-bundle -> target
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build native candidate
        working-directory: treetop-bundle
        run: cargo build --locked --release --target ${{ matrix.target }} -p treetop-bundle-cli
      - name: Download, verify, extract, and run candidate through production installer
        env:
          CANDIDATE_BINARY: treetop-bundle/target/${{ matrix.target }}/release/treetop-bundle${{ matrix.extension }}
        run: node scripts/verify-candidate-download.js
